; Two benchmark presets to append to a llama.cpp router config (--models-preset).
; They inherit its [*] section (jinja, q8_0/q8_0 KV, flash-attn, fit=off,
; reasoning-preserve=false, parallel=1, all layers on the 5090).
;
; What is pinned here, identically for both arms:
;   - 131072 context, q8_0/q8_0 KV (validated on an RTX 5090, 32 GB)
;   - the default embedded chat template (no Sharp / Claude Code template):
;     the harness only sends a leading system message, the stock template is enough
;   - embedded MTP ON for both (n=2, q8_0 draft KV), as both GGUFs ship the
;     MTP head. Check the load log of EACH arm once: if one of them falls back
;     to no speculation, set spec-type = none for both, or GPU time and Wh
;     would compare an accelerated arm with a plain one. Token counts are
;     unaffected either way. The draft acceptance rate is logged per request
;     (timings in the ledger) and reported per arm.
;   - sampler: set by the harness in every request (temp 0.7, top_p 0.95,
;     top_k 20, min_p 0), so the preset values below are only a fallback.
;
; The harness picks the preset with: worker.py --model bench-base (or bench-huihui).

[bench-base]
hf = unsloth/Qwen3.8-27B-GGUF:Q6_K
ctx-size = 131072
reasoning = auto
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
predict = 32768
spec-type = draft-mtp
spec-draft-ngl = all
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
spec-draft-n-max = 2
spec-draft-p-min = 0.0
load-on-startup = false

[bench-huihui]
hf = huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF:Q6_K
ctx-size = 131072
reasoning = auto
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
predict = 32768
spec-type = draft-mtp
spec-draft-ngl = all
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
spec-draft-n-max = 2
spec-draft-p-min = 0.0
load-on-startup = false
